spring.application.name=uno-cli
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.datasource.url=${UNO_DATABASE_URL:jdbc:postgresql://localhost:5432/uno}
spring.datasource.username=${UNO_DATABASE_USERNAME:uno}
spring.datasource.password=${UNO_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.flyway.enabled=true
