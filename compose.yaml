name: uno-cli

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${UNO_DATABASE_NAME:-uno}
      POSTGRES_USER: ${UNO_DATABASE_USERNAME:-uno}
      POSTGRES_PASSWORD: ${UNO_DATABASE_PASSWORD:?Set UNO_DATABASE_PASSWORD in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    shm_size: 128mb
    volumes:
      - uno-postgres-data:/var/lib/postgresql

  app:
    image: uno-cli:local
    build:
      context: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      UNO_DATABASE_URL: jdbc:postgresql://database:5432/${UNO_DATABASE_NAME:-uno}
      UNO_DATABASE_USERNAME: ${UNO_DATABASE_USERNAME:-uno}
      UNO_DATABASE_PASSWORD: ${UNO_DATABASE_PASSWORD:?Set UNO_DATABASE_PASSWORD in .env}

volumes:
  uno-postgres-data:
